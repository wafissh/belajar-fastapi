[project]
name = "belajar-fast-api"
version = "0.1.0"
description = "Async FastAPI blog with authentication, posts, image processing, and email system"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.138.1",
    "starlette==1.3.1",
    "uvicorn==0.49.0",
    "sqlalchemy==2.0.51",
    "asyncpg==0.31.0",
    "aiosqlite==0.22.1",
    "alembic==1.18.5",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "pydantic-extra-types==2.11.1",
    "pyjwt==2.13.0",
    "pwdlib==0.3.0",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.32",
    "jinja2==3.1.6",
    "aiosmtplib==5.1.2",
    "pillow==12.3.0",
    "boto3==1.43.61",
    "email-validator==2.3.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "anyio==4.14.1",
    "moto==5.2.2",
    "responses==0.26.2",
]
